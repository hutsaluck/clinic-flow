parameters:
    env(MAILER_FROM): 'noreply@clinicflow.test'
services:
    _defaults:
        autowire: true
        autoconfigure: true
    App\:
        resource: '../src/'
        exclude: ['../src/Entity/', '../src/Kernel.php', '../src/Notification/Delivery.php', '../src/Shared/ApiError.php', '../src/**/Domain/', '../src/Appointment/Application/CreateAppointment.php', '../src/Appointment/Application/ChangeAppointment.php', '../src/Billing/Application/RecordPayment.php', '../src/Billing/Application/ReversePayment.php']

    App\Shared\Domain\Clock: '@App\Shared\Infrastructure\SystemClock'
    App\Shared\Application\TransactionManager: '@App\Shared\Infrastructure\DoctrineTransactionManager'
    App\Appointment\Domain\AppointmentRepository: '@App\Appointment\Infrastructure\DoctrineAppointmentRepository'
    App\Appointment\Application\BookingAvailability: '@App\Scheduling\Availability'
    App\Appointment\Application\IdempotencyStore: '@App\Appointment\Infrastructure\DoctrineIdempotencyStore'
    App\Appointment\Application\AppointmentEvents: '@App\Appointment\Infrastructure\DoctrineAppointmentEvents'
    App\Billing\Domain\BillingRepository: '@App\Billing\Infrastructure\DoctrineBillingRepository'
