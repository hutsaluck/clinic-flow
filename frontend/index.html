<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <meta name="theme-color" content="#127c70" />
        <meta
            name="description"
            content="ClinicFlow — простір турботи про вашу клініку"
        />
        <title>ClinicFlow — керування клінікою</title>
    </head>
    <body>
        <script>
            try {
                document.documentElement.dataset.theme =
                    localStorage.getItem("clinicflow.theme.v1") ||
                    (matchMedia("(prefers-color-scheme: dark)").matches
                        ? "dark"
                        : "light");
            } catch {
                document.documentElement.dataset.theme = "light";
            }
        </script>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
